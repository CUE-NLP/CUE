<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUE CORS 확인</title>
    <style>
      body {
        font:
          16px/1.6 system-ui,
          sans-serif;
        max-width: 720px;
        margin: 48px auto;
        padding: 0 20px;
        color: #18212f;
      }
      h1 {
        font-size: 1.7rem;
      }
      button {
        padding: 10px 18px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 16px;
        background: #f2f5f9;
        border-radius: 8px;
      }
      .pass {
        color: #11633b;
      }
      .fail {
        color: #a32626;
      }
    </style>
  </head>
  <body>
    <h1>CUE CORS 브라우저 확인</h1>
    <p>현재 페이지 출처: <strong id="origin"></strong></p>
    <p>
      백엔드:
      <a href="http://localhost:8080/actuator/health" target="_blank" rel="noopener"
        >http://localhost:8080</a
      >
    </p>
    <p>
      5173에서는 응답을 읽을 수 있어야 하고, 5174에서는 브라우저가 차단해야 합니다. 이 페이지는 계정
      정보나 토큰을 사용하지 않습니다.
    </p>
    <button type="button" id="run">CORS 확인 실행</button>
    <div id="results" aria-live="polite"></div>
    <script>
      const api = 'http://localhost:8080'
      const origin = location.origin
      document.querySelector('#origin').textContent = origin
      const results = document.querySelector('#results')
      const allowed = ['http://localhost:5173', 'http://localhost:3000'].includes(origin)

      async function check(label, path, options) {
        try {
          const response = await fetch(api + path, {
            mode: 'cors',
            credentials: 'omit',
            ...options,
          })
          const body = await response.text()
          const passed = allowed
          return {
            label,
            passed,
            detail: `응답 읽기 성공 · HTTP ${response.status} · ${body.slice(0, 220)}`,
          }
        } catch (error) {
          const passed = !allowed && error instanceof TypeError
          return { label, passed, detail: `응답 읽기 실패 · ${error.name}: ${error.message}` }
        }
      }

      document.querySelector('#run').addEventListener('click', async () => {
        results.textContent = '백엔드 연결 확인 중...'
        try {
          await fetch(api + '/actuator/health', { mode: 'no-cors', credentials: 'omit' })
        } catch (error) {
          results.textContent =
            '백엔드 연결 실패: http://localhost:8080 서버가 실행 중인지 먼저 확인하세요.'
          return
        }
        results.textContent = 'CORS 요청 중...'
        const checks = await Promise.all([
          check('GET /api/users/me', '/api/users/me'),
          check('POST /api/auth/login (JSON 사전 요청)', '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: 'cors-check@example.invalid', password: 'invalid' }),
          }),
        ])
        results.replaceChildren()
        for (const result of checks) {
          const section = document.createElement('section')
          const heading = document.createElement('h2')
          heading.className = result.passed ? 'pass' : 'fail'
          heading.textContent = `${result.passed ? '예상대로 동작' : '확인 필요'} · ${result.label}`
          const detail = document.createElement('pre')
          detail.textContent = result.detail
          section.append(heading, detail)
          results.append(section)
        }
      })
    </script>
  </body>
</html>
