spring:
  application:
    name: cue-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cue}
    username: ${DB_USERNAME:cue}
    password: ${DB_PASSWORD:cue}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      # 기본은 꺼짐. ./gradlew bootRun 이 켜고 compose 파일 경로를 넘긴다 (build.gradle.kts 참고).
      # IDE에서 직접 실행할 때는 `docker compose up -d db` 로 DB를 먼저 띄운다.
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start_only

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 값을 주입한다.
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes!!}
  access-token-minutes: ${JWT_ACCESS_MINUTES:60}

cue:
  gemini:
    # false면 Gemini를 쓰지 않고 SimpleIdeaAnalyzer만 사용 (테스트 등). 키가 비어 있으면 호출 없이 폴백한다.
    enabled: ${GEMINI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}
    # 평가용 호출 사이 최소 간격(ms). 무료 티어 분당 한도(약 10회)용. 0이면 제한 없음
    min-interval-ms: ${GEMINI_MIN_INTERVAL_MS:6500}
  evaluation:
    # 일일 재평가 스케줄러. 테스트에서는 enabled=false.
    enabled: ${EVALUATION_ENABLED:true}
    cron: ${EVALUATION_CRON:0 0 3 * * *}
    zone: ${EVALUATION_ZONE:Asia/Seoul}
    # 아이디어 사이 대기(ms). Gemini 무료 티어 분당 호출 한도용 (아이디어당 최대 2회 호출)
    delay-ms: ${EVALUATION_DELAY_MS:15000}
  trend:
    # 글로벌 트렌드(5번째 평가 기준 TREND): 고정 provider(HN·GitHub·Hugging Face)를 키워드 없이 하루 1회 수집한다.
    # 최근 N일 안에 올라온 글·저장소를 인기 순으로 보고, provider마다 상위 top-n개를 읽어 요약한다 (Gemini 호출 수에 비례)
    days: ${TREND_DAYS:7}
    top-n: ${TREND_TOP_N:5}
  source:
    # 외부 자료 API 토큰/키: 모두 선택. 없으면 익명 호출(rate limit 낮음). 값은 환경변수로만 주입하고 커밋하지 않는다.
    connect-timeout: 3s
    read-timeout: 5s
    # source마다 읽고 요약할 상위 항목 수 (Gemini 호출 수에 비례)
    top-n: ${SOURCE_TOP_N:5}
    # "급상승" 판단 기간(일): 최근 N일 안의 글·저장소를 인기 순으로
    trending-days: ${SOURCE_TRENDING_DAYS:30}
    # 원문을 Gemini에 보내기 전 자르는 글자 수 / 웹 원문 응답 크기 상한(바이트) / 리다이렉트 최대 횟수
    max-content-chars: ${SOURCE_MAX_CONTENT_CHARS:8000}
    fetch-max-bytes: 1048576
    max-redirects: 3
    # 같은 URL의 항목 요약을 재사용하는 기간(일). 0이면 항상 다시 요약
    summary-reuse-days: ${SOURCE_SUMMARY_REUSE_DAYS:7}
    github:
      token: ${GITHUB_TOKEN:}
    hugging-face:
      token: ${HUGGING_FACE_TOKEN:}
    stack-exchange:
      token: ${STACK_EXCHANGE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
