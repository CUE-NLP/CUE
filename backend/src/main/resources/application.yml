spring:
  application:
    name: cue-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cue}
    username: ${DB_USERNAME:cue}
    password: ${DB_PASSWORD:cue}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  docker:
    compose:
      # 기본은 꺼짐. ./gradlew bootRun 이 켜고 compose 파일 경로를 넘긴다 (build.gradle.kts 참고).
      # IDE에서 직접 실행할 때는 `docker compose up -d db` 로 DB를 먼저 띄운다.
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start_only

jwt:
  # 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 값을 주입한다.
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32bytes!!}
  access-token-minutes: ${JWT_ACCESS_MINUTES:60}
  refresh-token-days: ${JWT_REFRESH_DAYS:14}

cors:
  # 쉼표로 여러 개 지정. 운영에서는 실제 프론트 도메인으로 제한한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

cue:
  auth:
    cleanup:
      # 만료된 리프레시 토큰·폐기 액세스 토큰 정리 주기(cron). "-" 면 비활성화
      cron: ${AUTH_CLEANUP_CRON:0 0 4 * * *}
  gemini:
    # false면 Gemini를 쓰지 않고 SimpleIdeaAnalyzer만 사용 (테스트 등). 키가 비어 있으면 호출 없이 폴백한다.
    enabled: ${GEMINI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    # 무료 티어 한도(AI Studio 확인): gemini-3.5-flash-lite 분당 15회·일일 500회, 일반 Flash 계열은 분당 5회·일일 20회라 평가 배치에 부족하다
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:10}
    # 평가용 호출 사이 최소 간격(ms). 무료 티어 분당 한도(3.5 Flash-Lite는 15회, 6500ms면 분당 약 9회)용. 0이면 제한 없음
    min-interval-ms: ${GEMINI_MIN_INTERVAL_MS:6500}
    # 배치 호출이 429/503을 받았을 때 재시도 횟수 (지수 백오프, Retry-After 우선)
    max-retries: ${GEMINI_MAX_RETRIES:2}
    # 인터랙티브 레인(구조화·키워드 추출): 사용자가 기다리는 호출. 모델을 따로 두면 모델별 한도가 분리된다. 비우면 기본 모델
    interactive:
      model: ${GEMINI_INTERACTIVE_MODEL:gemini-3.1-flash-lite}
      min-interval-ms: ${GEMINI_INTERACTIVE_MIN_INTERVAL_MS:2000}
      # 속도 제한 때문에 기다릴 수 있는 최대 시간(ms). 넘으면 E006 (AI 바쁨)
      max-wait-ms: ${GEMINI_INTERACTIVE_MAX_WAIT_MS:5000}
      max-retries: ${GEMINI_INTERACTIVE_MAX_RETRIES:1}
  claude-gateway:
    enabled: ${CLAUDE_GATEWAY_ENABLED:false}
    api-key: ${CLAUDE_GATEWAY_API_KEY:}
    base-url: ${CLAUDE_GATEWAY_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway/claude}
    model: ${CLAUDE_GATEWAY_MODEL:claude-opus-5-5}
    timeout-seconds: ${CLAUDE_GATEWAY_TIMEOUT_SECONDS:45}
    max-tokens: ${CLAUDE_GATEWAY_MAX_TOKENS:4096}
  openai-gateway:
    enabled: ${OPENAI_GATEWAY_ENABLED:false}
    api-key: ${OPENAI_GATEWAY_API_KEY:}
    base-url: ${OPENAI_GATEWAY_BASE_URL:https://factchat-cloud.mindlogic.ai/v1/gateway}
    model: ${OPENAI_GATEWAY_MODEL:}
    timeout-seconds: ${OPENAI_GATEWAY_TIMEOUT_SECONDS:45}
    max-output-tokens: ${OPENAI_GATEWAY_MAX_OUTPUT_TOKENS:4096}
  structuring:
    # 같은 사용자의 구조화 요청 최소 간격(초). 캐시 적중은 소비하지 않는다
    cooldown-seconds: ${STRUCTURING_COOLDOWN_SECONDS:3}
    # 같은 원문 결과 캐시 유지 시간(분)과 최대 개수. 저장 때 키워드·종류 재추출을 생략하는 근거로도 쓴다
    cache-ttl-minutes: ${STRUCTURING_CACHE_TTL_MINUTES:10}
    cache-max-entries: ${STRUCTURING_CACHE_MAX_ENTRIES:500}
  evaluation:
    # 일일 재평가 스케줄러. 테스트에서는 enabled=false.
    enabled: ${EVALUATION_ENABLED:true}
    cron: ${EVALUATION_CRON:0 0 3 * * *}
    zone: ${EVALUATION_ZONE:Asia/Seoul}
    # 아이디어 사이 대기(ms). Gemini 무료 티어 분당 호출 한도용 (아이디어당 최대 2회 호출)
    delay-ms: ${EVALUATION_DELAY_MS:15000}
    # 등록·내용 수정으로 ACTIVE가 되면 첫 평가를 자동으로 큐에 넣는다 (프론트 "분석 중" 화면용). 테스트에서는 false
    auto-on-save: ${EVALUATION_AUTO_ON_SAVE:true}
    # 평가 대기열 상한(가득 차면 E004) / 종료 시 진행 중 평가를 기다리는 시간(초). 평가는 한 번에 하나만 실행한다
    queue-capacity: ${EVALUATION_QUEUE_CAPACITY:50}
    shutdown-wait-seconds: ${EVALUATION_SHUTDOWN_WAIT_SECONDS:30}
  trend:
    # 글로벌 트렌드(5번째 평가 기준 TREND): 고정 provider(HN·GitHub·Hugging Face)를 키워드 없이 하루 1회 수집한다.
    # 최근 N일 안에 올라온 글·저장소를 인기 순으로 보고, provider마다 상위 top-n개를 읽어 요약한다 (Gemini 호출 수에 비례)
    days: ${TREND_DAYS:7}
    top-n: ${TREND_TOP_N:5}
    # 아이디어의 TREND 재평가 최소 간격(일). 기본 1 = 하루에 한 번(트렌드는 하루 1회 갱신, 상위 항목이 어제와 같으면 새 트렌드가 없어 호출도 없다). 첫 평가는 바로. 0이면 같은 날 새 트렌드에도 평가
    min-reeval-days: ${TREND_MIN_REEVAL_DAYS:1}
  source:
    api-log-file: ${SOURCE_API_LOG_FILE:}
    # 외부 자료 API 토큰/키: 모두 선택. 없으면 익명 호출(rate limit 낮음). 값은 환경변수로만 주입하고 커밋하지 않는다.
    connect-timeout: 3s
    read-timeout: 5s
    # source마다 읽을 상위 항목 수 (근거 자료는 AI 요약 없이 원문 발췌를 평가 프롬프트에 직접 넣는다. 글로벌 트렌드는 Gemini 호출 크기에 비례)
    top-n: ${SOURCE_TOP_N:5}
    # 원문을 Gemini에 보내기 전 자르는 글자 수 / 웹 원문 응답 크기 상한(바이트) / 리다이렉트 최대 횟수
    max-content-chars: ${SOURCE_MAX_CONTENT_CHARS:8000}
    fetch-max-bytes: 1048576
    max-redirects: 3
    # 키워드 근거 자료: 항목 하나당 평가 프롬프트에 직접 넣는 원문 발췌 길이(글자). AI 요약 호출 없이 정리한 원문 앞부분을 쓴다
    excerpt-chars: ${SOURCE_EXCERPT_CHARS:800}
    # (글로벌 트렌드만) 같은 URL의 항목 요약을 재사용하는 기간(일). 0이면 항상 다시 요약
    summary-reuse-days: ${SOURCE_SUMMARY_REUSE_DAYS:7}
    # (글로벌 트렌드만) 항목 일괄 요약(provider당 1회 호출): 항목당 원문 상한 / 한 호출의 원문 전체 상한(글자)
    batch-content-chars: ${SOURCE_BATCH_CONTENT_CHARS:4000}
    batch-total-chars: ${SOURCE_BATCH_TOTAL_CHARS:16000}
    # Wikipedia: 문서 조회수를 합산할 최근 일수 / Wikimedia 필수 User-Agent(개인 이메일 금지)
    pageviews-days: ${SOURCE_PAGEVIEWS_DAYS:30}
    wikimedia-user-agent: ${WIKIMEDIA_USER_AGENT:CUE-idea-portfolio/1.0 (student project; non-commercial)}
    github:
      token: ${GITHUB_TOKEN:}
    hugging-face:
      token: ${HUGGING_FACE_TOKEN:}
    stack-exchange:
      token: ${STACK_EXCHANGE_KEY:}
    semantic-scholar:
      token: ${SEMANTIC_SCHOLAR_API_KEY:}

  demo:
    # 시연용 "지금 조회·평가" API(POST /api/demo/evaluations/run). 기본 꺼짐: 호출이 Gemini 무료 한도를 소진시킬 수 있다
    enabled: ${DEMO_API_ENABLED:false}
    cooldown-seconds: ${DEMO_COOLDOWN_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
